server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: adapstory-plugin-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    group:
      dev-local: dev    # --spring.profiles.active=dev-local → includes dev (K8s URLs)
      dev-remote: dev   # --spring.profiles.active=dev-remote → includes dev (K8s URLs)

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: plugin-gateway-group
      auto-offset-reset: earliest

# Keycloak JWKS configuration
gateway:
  # Long-lived SSE requests use a dedicated bounded servlet executor. A zero-capacity queue
  # applies backpressure immediately instead of accumulating disconnected preview requests.
  event-stream:
    core-pool-size: ${GATEWAY_EVENT_STREAM_CORE_POOL_SIZE:4}
    max-pool-size: ${GATEWAY_EVENT_STREAM_MAX_POOL_SIZE:32}
    queue-capacity: ${GATEWAY_EVENT_STREAM_QUEUE_CAPACITY:0}
    await-termination-seconds: ${GATEWAY_EVENT_STREAM_AWAIT_TERMINATION_SECONDS:30}
  jwt:
    jwks-uri: http://localhost:8180/realms/adapstory/protocol/openid-connect/certs
    issuer: http://localhost:8180/realms/adapstory
    audience: adapstory-plugin-gateway
    jwks-cache-ttl-minutes: 60  # ARCH-1: Keycloak SPOF mitigation — 60 min cache
  bff-user-jwt:
    enabled: true
    audiences:
      - adapstory-bff-school
      - adapstory-api
      - lms-client
      - account

  # Route-to-BC mapping (overridden by GATEWAY_ROUTES_* env vars in cluster)
  routes:
    content: http://localhost:8080
    submission: http://localhost:8080
    identity: http://localhost:8082
    plugin: http://localhost:8083
    tenant: http://localhost:8081

  # Browser-facing plugin route slugs are stable public URLs; BC-02 security checks use canonical
  # manifest identifiers.
  plugin-id-aliases:
    ai-course-generator: adapstory.ai.coursegenerator

  # Route-to-permission mapping (HTTP method -> required permission suffix)
  permissions:
    route-mappings:
      content:
        GET: content.read
        POST: content.write
        PUT: content.write
        DELETE: content.write
      submission:
        GET: submission.read
        POST: submission.write
        PUT: submission.write
        DELETE: submission.write
      identity:
        GET: identity.read
        POST: identity.write
        PUT: identity.write
        DELETE: identity.write
      plugin:
        GET: plugin.read
        POST: plugin.write
        PUT: plugin.write
        DELETE: plugin.write
      tenant:
        GET: tenant.read
        POST: tenant.write
        PUT: tenant.write
        DELETE: tenant.write

  # BC-02 (Plugin Lifecycle) connection for manifest-based permission checks (SEC-3.2)
  bc02:
    base-url: http://localhost:8083

  # Kafka topic configuration
  kafka:
    topics:
      permission-revocation: GLOBAL_PLUGIN_PERMISSIONS_REVOKED
    listeners:
      permission-revocation:
        auto-startup: ${GATEWAY_KAFKA_PERMISSION_REVOCATION_AUTO_STARTUP:true}

  # Permission cache
  permission-cache:
    ttl-minutes: 5
    key-prefix: "plugin:permissions:"

  # Installed-plugin cache (Redis cache-aside for BC-02 installed checks)
  installed-cache:
    ttl-minutes: 5
    negative-ttl-seconds: 30

  # MCP Streamable HTTP route (POST/GET/DELETE on one canonical endpoint).
  mcp:
    plugin-pod-port: 8000
    plugin-host-template: "plugin-%s.plugins.svc.cluster.local"
    session-affinity-host-template: "plugin-%s-mcp-headless.plugins.svc.cluster.local"
    connect-timeout-ms: 30000
    # Zero means no response-duration cap, required for long-lived MCP SSE streams.
    streaming-read-timeout-ms: ${GATEWAY_MCP_STREAMING_READ_TIMEOUT_MS:0}
    session-affinity-ttl-seconds: ${GATEWAY_MCP_SESSION_AFFINITY_TTL_SECONDS:86400}
    session-affinity-redis-key-prefix: ${GATEWAY_MCP_SESSION_AFFINITY_REDIS_KEY_PREFIX:gateway:mcp-session-affinity:v1:}
    # Optional per-slug backend route overrides for deployed plugin services with env-specific names.
    # Used by both MCP and first-party REST plugin proxy routes.
    # Env example: GATEWAY_MCP_PLUGIN_ROUTES_0_SLUG=dify-plugin,
    # GATEWAY_MCP_PLUGIN_ROUTES_0_BASE_URL=http://dev-dify-plugin-svc.env-dev.svc.cluster.local:8000
    # GATEWAY_MCP_PLUGIN_ROUTES_0_SESSION_AFFINITY_BASE_URL=http://dev-dify-plugin-mcp-headless.env-dev.svc.cluster.local:8000
    plugin-routes: []
    grants:
      # Only the OAuth client that performs RFC 8693 exchange may register exact bindings.
      authorized-parties: ${GATEWAY_MCP_GRANT_AUTHORIZED_PARTIES:adapstory-bc10-gateway-exchange}
      maximum-ttl-seconds: ${GATEWAY_MCP_GRANT_MAXIMUM_TTL_SECONDS:300}
      minimum-validity-seconds: ${GATEWAY_MCP_GRANT_MINIMUM_VALIDITY_SECONDS:5}
      replay-retention-seconds: ${GATEWAY_MCP_GRANT_REPLAY_RETENTION_SECONDS:60}
      maximum-request-body-bytes: ${GATEWAY_MCP_GRANT_MAXIMUM_REQUEST_BODY_BYTES:65536}
      maximum-registration-body-bytes: ${GATEWAY_MCP_GRANT_MAXIMUM_REGISTRATION_BODY_BYTES:65536}
      redis-key-prefix: ${GATEWAY_MCP_GRANT_REDIS_KEY_PREFIX:gateway:mcp-grant:v1:}

  # Webhook dispatch
  webhook:
    retry-max-attempts: 3
    retry-initial-interval-ms: 1000
    retry-multiplier: 2.0
    plugin-pod-port: 8000
    plugin-pod-host-template: "plugin-%s"
    internal-secret: ""

# Note: Resilience4j circuit breaker is configured programmatically in ResilienceConfig.java
# (per-route isolation via CircuitBreakerRegistry). Do NOT add resilience4j YAML section here.

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  opentelemetry:
    resource-attributes:
      "tenant.id": "${TENANT_ID:unknown}"

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs

adapstory:
  web:
    etag:
      enabled: false
  openapi:
    enabled: ${SPRINGDOC_ENABLED:true}
    title: Plugin Gateway API
    summary: Internal plugin and MCP gateway API
    description: First-party internal API for BC-02 Plugin Gateway REST proxying, webhook dispatch, and MCP routing for plugin tools.
    version: ${ADAPSTORY_OPENAPI_VERSION:2026.07.1}
    api-major: v1
    audience: internal
    ai-ready: true
  service-auth:
    enabled: ${SERVICE_AUTH_ENABLED:true}
    token-endpoint: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/adapstory/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_CLIENT_ID:adapstory-plugin-gateway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    forwarded-base-url: ${ADAPSTORY_SERVICE_AUTH_FORWARDED_BASE_URL:}
    refresh-buffer-seconds: 60
